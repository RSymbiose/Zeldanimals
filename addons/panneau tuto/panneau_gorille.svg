<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3ab6d"/>
      <stop offset="1" stop-color="#cf9253"/>
    </linearGradient>
    <clipPath id="boardClip"><rect x="64" y="84" width="896" height="600" rx="22"/></clipPath>
    <clipPath id="doorClip"><path d="M620 610 V300 A125 125 0 0 1 870 300 V610 Z"/></clipPath>
  </defs>

  <!-- ===== Panneau en bois ===== -->
  <rect x="40" y="60" width="944" height="648" rx="34" fill="#7a3f26"/>
  <rect x="48" y="64" width="928" height="26" rx="24" fill="#94522f" opacity=".7"/>
  <rect x="64" y="84" width="896" height="600" rx="22" fill="url(#wood)"/>
  <g clip-path="url(#boardClip)" fill="none" stroke-linecap="round">
    <!-- jointures des planches -->
    <path d="M288 84V684M512 84V684M736 84V684" stroke="#a96a3a" stroke-width="6"/>
    <path d="M293 84V684M517 84V684M741 84V684" stroke="#f0bf86" stroke-width="3" opacity=".6"/>
    <!-- veines du bois -->
    <g stroke="#c28348" stroke-width="4" opacity=".65">
      <path d="M100 160 C150 150 200 172 250 160"/>
      <path d="M110 420 C160 410 210 432 262 420"/>
      <path d="M100 640 C150 630 200 652 250 640"/>
      <path d="M322 230 C372 220 422 242 478 230"/>
      <path d="M330 520 C380 510 430 532 486 520"/>
      <path d="M548 130 C598 120 648 142 700 130"/>
      <path d="M548 650 C598 640 648 662 700 650"/>
      <path d="M770 200 C820 190 870 212 925 200"/>
      <path d="M776 540 C826 530 876 552 930 540"/>
    </g>
  </g>
  <!-- clous -->
  <g fill="#3b2a24">
    <circle cx="96" cy="116" r="10"/><circle cx="928" cy="116" r="10"/>
    <circle cx="96" cy="652" r="10"/><circle cx="928" cy="652" r="10"/>
  </g>
  <g fill="#8b6b5c">
    <circle cx="93" cy="113" r="3.5"/><circle cx="925" cy="113" r="3.5"/>
    <circle cx="93" cy="649" r="3.5"/><circle cx="925" cy="649" r="3.5"/>
  </g>

  <!-- ===== Sol ===== -->
  <rect x="110" y="608" width="804" height="12" rx="6" fill="#5a5e66"/>

  <!-- ===== Porte (silhouette grise) ===== -->
  <path d="M620 610 V300 A125 125 0 0 1 870 300 V610 Z" fill="#6d7179"/>
  <g clip-path="url(#doorClip)" fill="none" stroke="#555962">
    <path d="M670 160V610M720 160V610M770 160V610M820 160V610" stroke-width="5"/>
    <path d="M610 300H880M610 520H880" stroke-width="18"/>
  </g>
  <circle cx="830" cy="430" r="15" fill="none" stroke="#3c4047" stroke-width="7"/>
  <!-- fissures -->
  <g clip-path="url(#doorClip)" fill="none" stroke="#2d3035" stroke-width="6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M640 352 L690 326 L702 288 L742 262"/>
    <path d="M640 352 L698 384 L712 432 L772 458"/>
    <path d="M640 352 L676 404 L662 474"/>
  </g>

  <!-- poussière au pied de la porte -->
  <g fill="#8c9098" opacity=".9">
    <circle cx="606" cy="598" r="22"/><circle cx="578" cy="606" r="15"/><circle cx="644" cy="602" r="18"/>
  </g>

  <!-- ===== Gorille (silhouette grise) ===== -->
  <g fill="#3c4047">
    <!-- jambes et pieds -->
    <ellipse cx="235" cy="552" rx="52" ry="58"/>
    <ellipse cx="262" cy="596" rx="64" ry="16"/>
    <ellipse cx="322" cy="556" rx="50" ry="56"/>
    <ellipse cx="350" cy="597" rx="62" ry="15"/>
    <!-- bassin -->
    <ellipse cx="228" cy="495" rx="62" ry="72"/>
    <!-- torse penché en avant -->
    <ellipse cx="300" cy="390" rx="118" ry="165" transform="rotate(25 300 390)"/>
    <!-- bosse des épaules -->
    <ellipse cx="345" cy="262" rx="105" ry="72" transform="rotate(18 345 262)"/>
    <!-- tête -->
    <ellipse cx="448" cy="262" rx="50" ry="50"/>
    <ellipse cx="438" cy="222" rx="34" ry="26" transform="rotate(-14 438 222)"/>
    <ellipse cx="492" cy="282" rx="44" ry="34"/>
    <!-- bras qui frappe -->
    <path d="M340 298 C420 332 500 334 574 324 L562 402 C500 398 440 402 372 396 Z"/>
    <ellipse cx="598" cy="358" rx="56" ry="50"/>
    <circle cx="644" cy="332" r="13"/><circle cx="652" cy="362" r="13"/><circle cx="644" cy="392" r="13"/>
    <!-- bras d'appui -->
    <path d="M300 330 C345 430 405 505 436 590" stroke="#3c4047" stroke-width="66"
          stroke-linecap="round" fill="none"/>
    <ellipse cx="444" cy="594" rx="48" ry="22"/>
  </g>

  <!-- ===== Éclats de bois qui volent ===== -->
  <g fill="#6d7179" stroke="#555962" stroke-width="3" stroke-linejoin="round">
    <polygon points="575,250 610,236 622,262 590,278"/>
    <polygon points="640,215 670,200 684,225 655,240"/>
    <polygon points="540,288 566,278 574,304 548,312"/>
    <polygon points="596,206 608,184 616,210"/>
    <polygon points="690,236 712,224 716,250"/>
  </g>
</svg>
